instance: dbperf-1
role: all
registry:
  type: grpc
  addr: registry:9100
  max_targets: 2        # capacity for failover: one instance can run both bench targets
  refresh: 15s
clickhouse:
  addrs: ["clickhouse:9000"]
  database: dbperf
  user: default
  flush_interval: 5s
  flush_rows: 40000
api:
  grpc_addr: ":9090"
  http_addr: ":9091"
log:
  level: info
  format: text
