# Test bench: PostgreSQL 16 with pgbench load, ClickHouse, dbperf (collector + API) and the UI behind nginx.
# Usage: make up (repo root): builds the dbperf linux binary and the UI bundle, then docker compose up --build.
# Images are built from services/dbperf and services/dbperf-ui.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements -c track_io_timing=on
               -c compute_query_id=on -c max_connections=300
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbench-init:
    image: postgres:16
    depends_on:
      postgres: { condition: service_healthy }
    environment: { PGPASSWORD: postgres }
    command: ["pgbench", "-h", "postgres", "-U", "postgres", "-i", "-s", "10", "pgbench"]
    restart: "no"

  pgbench:
    image: postgres:16
    depends_on:
      pgbench-init: { condition: service_completed_successfully }
    environment: { PGPASSWORD: postgres }
    # 20 clients, 4 threads, forever; restarts if pgbench exits
    command: ["pgbench", "-h", "postgres", "-U", "postgres", "-c", "20", "-j", "4", "-T", "86400", "-P", "30", "pgbench"]
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports: ["9000:9000", "8123:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30

  dbperf:
    build:
      context: ../services/dbperf
      dockerfile: Dockerfile.prebuilt
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      DBPERF_CONFIG: /etc/dbperf/config.yaml
    volumes:
      - ./dbperf/config.yaml:/etc/dbperf/config.yaml:ro
      - ./dbperf/targets.yaml:/etc/dbperf/targets.yaml:ro
    ports: ["9090:9090", "9091:9091"]
    restart: unless-stopped

  ui:
    build:
      context: ../services/dbperf-ui
      dockerfile: Dockerfile.prebuilt
    depends_on:
      - dbperf
    ports: ["8081:80"]  # 8080 is often taken by other local tools
    restart: unless-stopped

volumes:
  clickhouse-data:
