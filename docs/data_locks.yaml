      CREATE TABLE sa_input_sessions_enriched AS
      WITH
      cfg AS (
        SELECT property_value_max_len value_max_len,
               query_text_property_max_len query_text_max_len
        FROM properties_config
        LIMIT 1
      )
      SELECT unix_time,
             process_id,
             t.client_addr, t.client_addr_overflow, ch.client_host_id,
             t.usename, t.usename_overflow, un.usename_id,
             t.datid, t.datname, t.datname_overflow, dn.datname_id,
             t.state, t.state_overflow, sn.state_id,
             t.query_text, t.query_text_overflow, q.ki_query_id ki_query_id,
             t.wait_event_type, t.wait_event_type_overflow, wet.wait_event_type_id,
             t.wait_event, t.wait_event_overflow, we.wait_event_id
      FROM (
        SELECT s.unix_time unix_time,
               process_id,
               substr(s.client_addr, 1, cfg.value_max_len) client_addr,
               CASE
                 WHEN length(s.client_addr) > cfg.value_max_len
                 THEN TRUE
                 ELSE NULL
               END client_addr_overflow,
               substr(s.usename, 1, cfg.value_max_len) usename,
               CASE
                 WHEN length(s.usename) > cfg.value_max_len
                 THEN TRUE
                 ELSE NULL
               END usename_overflow,
               datid,
               substr(s.datname, 1, cfg.value_max_len) datname,
               CASE
                 WHEN length(s.datname) > cfg.value_max_len
                 THEN TRUE
                 ELSE NULL
               END datname_overflow,
               substr(s.state, 1, cfg.value_max_len) state,
               CASE
                 WHEN length(s.state) > cfg.value_max_len
                 THEN TRUE
                 ELSE NULL
               END state_overflow,
               substr(s.query, 1, cfg.query_text_max_len) query_text,
               CASE
                 WHEN length(s.query) > cfg.query_text_max_len
                 THEN TRUE
                 ELSE NULL
               END query_text_overflow,
               substr(s.wait_event_type, 1, cfg.value_max_len) wait_event_type,
               CASE
                 WHEN length(s.wait_event_type) > cfg.value_max_len
                 THEN TRUE
                 ELSE NULL
               END wait_event_type_overflow,
               substr(s.wait_event, 1, cfg.value_max_len) wait_event,
               CASE
                 WHEN length(s.wait_event) > cfg.value_max_len
                 THEN TRUE
                 ELSE NULL
               END wait_event_overflow
        FROM cfg, sa_input_sessions_data s
      ) t
      LEFT JOIN sa_client_hosts ch ON (t.client_addr = ch.client_addr)
      LEFT JOIN sa_usenames un ON (t.usename = un.usename)
      LEFT JOIN sa_datnames dn ON (t.datname = dn.datname)
      LEFT JOIN sa_states sn ON (t.state = sn.state)
      LEFT JOIN sa_queries q ON (t.query_text = q.query_text)
      LEFT JOIN sa_wait_event_types wet ON (t.wait_event_type = wet.wait_event_type)
      LEFT JOIN sa_wait_events we ON (t.wait_event = we.wait_event);
    
