      UPDATE locks_objects
      SET last_used = (
        SELECT MAX(unix_time)
        FROM locks_input_enriched
        WHERE object_id IS NOT NULL
      )
      WHERE object_id IN (
        SELECT DISTINCT object_id
        FROM locks_input_enriched
        WHERE object_id IS NOT NULL
      )
      AND last_used < (
        SELECT MAX(unix_time)
        FROM locks_input_enriched
        WHERE object_id IS NOT NULL
      );
      
      INSERT INTO locks_objects (datname_id, relation, page, tuple, classid, objid, objsubid, last_used)
      SELECT datname_id,
             relation,
             page,
             tuple,
             classid,
             objid,
             objsubid,
             MAX(unix_time)
      FROM locks_input_enriched
      WHERE object_id IS NULL
      GROUP BY datname_id, relation, page, tuple, classid, objid, objsubid
      ON CONFLICT(datname_id, relation, page, tuple, classid, objid, objsubid) DO UPDATE
      SET last_used = (SELECT MAX(unix_time)
                       FROM locks_input_enriched
                       WHERE object_id IS NOT NULL);
      
      UPDATE locks_input_enriched AS e
      SET object_id = (
        SELECT l.object_id
        FROM locks_objects l
        WHERE l.datname_id = e.datname_id
          AND l.relation = e.relation
          AND l.page = e.page
          AND l.tuple = e.tuple
          AND l.classid = e.classid
          AND l.objid = e.objid
          AND l.objsubid = e.objsubid
      )
      WHERE object_id IS NULL;
    
      INSERT INTO locks_1s_sample_groups
      SELECT unix_time,
             1 n_samples,
             SUM(n_elements) n_elements
      FROM locks_input_count
      GROUP BY unix_time
      ON CONFLICT(unix_time) DO UPDATE
      SET n_samples = n_samples + excluded.n_samples,
          n_elements = n_elements + excluded.n_elements;
    
      INSERT INTO locks_1s_metrics
      SELECT unix_time,
             0 n_blocking,
             0 n_blocked
      FROM locks_input_count
      WHERE (unix_time - (SELECT MIN(unix_time)
                          FROM locks_1s_start_ts)) % (SELECT alignment
                                                      FROM alignment_config
                                                      WHERE data_table = 'locks_1s_data') = 0
      GROUP BY unix_time
      ON CONFLICT(unix_time) DO UPDATE
            SET n_blocking = n_blocking + excluded.n_blocking,
                n_blocked = n_blocked + excluded.n_blocked;
    
      INSERT INTO locks_1s_metrics
      SELECT blocking_procs.unix_time,
             COUNT(DISTINCT blocking_procs.blocking_pid) n_blocking,
             COUNT(DISTINCT blocking_procs.blocked_pid) n_blocked
      FROM (SELECT kl.unix_time,
                   kl.process_id blocking_pid,
                   bl.process_id blocked_pid
            FROM locks_input_enriched bl
            JOIN locks_input_enriched kl ON bl.locktype = kl.locktype 
                  	  	    			AND NOT bl.datid IS distinct FROM kl.datid
                  	  					AND NOT bl.relation IS distinct FROM kl.relation
                  	  					AND NOT bl.page IS distinct FROM kl.page
                  	  					AND NOT bl.tuple IS distinct FROM kl.tuple
                  	  					AND NOT bl.virtualxid IS distinct FROM kl.virtualxid
                  	  					AND NOT bl.transactionid IS distinct FROM kl.transactionid
                  	  					AND NOT bl.classid IS distinct FROM kl.classid
                  	  					AND NOT bl.objid IS distinct FROM kl.objid
                  	  					AND NOT bl.objsubid IS distinct FROM kl.objsubid
                  	  					AND bl.process_id <> kl.process_id
            WHERE kl.granted
            AND NOT bl.granted) blocking_procs
      WHERE (blocking_procs.unix_time - (SELECT MIN(unix_time)
                                         FROM locks_1s_start_ts)) % (SELECT alignment
                                                                     FROM alignment_config
                                                                     WHERE data_table = 'locks_1s_data') = 0
      GROUP BY unix_time
      ON CONFLICT(unix_time) DO UPDATE
      SET n_blocking = n_blocking + excluded.n_blocking,
          n_blocked = n_blocked + excluded.n_blocked;
    
      WITH
