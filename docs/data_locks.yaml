               usename_id,
               client_host_id,
               state_id,
               wait_event_type_id,
               wait_event_id,
               ki_query_id,
               virtualxid,
               transactionid,
               granted,
               COUNT(*) n_elements
        FROM locks_input_enriched
        GROUP BY unix_time,
                 process_id,
                 xact_start,
                 state_change,
                 query_start,
                 locktype_id,
                 mode_id,
                 object_id,
                 usename_id,
                 client_host_id,
                 state_id,
                 wait_event_type_id,
                 wait_event_id,
                 ki_query_id,
                 virtualxid,
