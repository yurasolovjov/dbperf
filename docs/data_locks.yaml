             datname,
             datname_overflow,
             MAX(unix_time)
      FROM locks_input_enriched
      WHERE datname_id IS NULL
      GROUP BY datid, datname, datname_overflow
      ON CONFLICT(datname) DO UPDATE
      SET last_used = (
        SELECT MAX(unix_time)
        FROM locks_input_enriched
        WHERE datname_id IS NULL);
      
      UPDATE locks_input_enriched AS e
