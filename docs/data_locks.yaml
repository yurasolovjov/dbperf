                 wait_event_id
      )
      INSERT INTO sa_active_1m_data
      SELECT * FROM pre_grouped
      WHERE TRUE
      ON CONFLICT (
        unix_time,
        process_id,
        client_host_id,
        usename_id,
        datname_id,
        ki_query_id,
        wait_event_type_id,
        wait_event_id
      ) DO UPDATE 
      SET n_elements = n_elements + excluded.n_elements;
    
      UPDATE service_counters
      SET n_merge_events = n_merge_events + 1,
          n_merged_samples = n_merged_samples + (SELECT COUNT(DISTINCT unix_time)
                                                 FROM sa_active_input_sessions_count),
          n_merged_sessions = n_merged_sessions + (SELECT COALESCE(SUM(n_elements), 0)
                                                   FROM sa_active_input_sessions_count),
          n_merged_locks = n_merged_locks + (SELECT COALESCE(SUM(n_elements), 0)
                                             FROM locks_input_count
          );
    
      DROP TABLE sa_input_sessions_enriched;
    
      DROP TABLE locks_input_enriched;
    
      DROP TABLE data_raw_input;
      CREATE TABLE data_raw_input AS SELECT * FROM data_raw_input_template;
data:
  check_timestamp_existence: >
    SELECT EXISTS(SELECT ?2 dummy 
                  FROM locks_1s_data d
                  JOIN locks_objects_extended e ON (d.object_id = e.object_id)
                  WHERE unix_time = ?1
                    AND ({{.Filter}})
    );
  check_locks_metrics: >
    SELECT EXISTS(SELECT ?3 dummy FROM locks_1s_metrics WHERE unix_time >= ?1 AND unix_time <= ?2);
  select_slice_time_totals_locks: >
    WITH bounded_totals AS (
      SELECT t.unix_time/?1*?1,
             t.unix_time,
             SUM(t.n_samples) n_samples,
             SUM(m.n_{{.Type}}) n_elements 
      FROM locks_1s_sample_groups t
      JOIN locks_1s_metrics m USING(unix_time)
      WHERE t.unix_time >= ?2
        AND t.unix_time < (?3 + ?1)
      GROUP BY 1
    ),
    dummy AS (
      SELECT ?4
    )
    SELECT unix_time,
           ROUND(CAST(n_elements  AS REAL) / n_samples, 3) aas_value,
           ROUND(CAST(n_total_sessions AS REAL) / n_total_samples, 3) avg_aas_value
    FROM (
        SELECT unix_time,
               n_samples,
               n_elements ,
               SUM(n_samples) OVER (ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_total_samples,
               SUM(n_elements) OVER (ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_total_sessions
        FROM bounded_totals bt
    );
  select_locks_metrics_per_ts: >
    WITH dummy AS (
      SELECT ?2
    )
    SELECT n_blocking,
           n_blocked
    FROM locks_1s_metrics
    WHERE unix_time = ?1;
  select_locks_tree_per_ts: >
    WITH cfg AS (
      SELECT query_text_property_max_len
      FROM properties_config
      LIMIT 1
    ),
    dummy AS (
      SELECT ?2
    ),
    data AS (
      WITH l AS (SELECT d.*,
                        e.datname_id,
                        e.datid,
                        CASE
                          WHEN e.relation = 0
                          THEN NULL
                          ELSE e.relation 
                        END relation,
                        CASE
                          WHEN e.page = 0
                          THEN NULL
                          ELSE e.page
                        END page,
                        CASE
                          WHEN e.tuple = 0
                          THEN NULL
                          ELSE e.tuple
                        END tuple,
                        CASE
                          WHEN e.classid = 0
                          THEN NULL
                          ELSE e.classid
                        END classid,
                        CASE
                          WHEN e.objid = 0
                          THEN NULL
                          ELSE e.objid
                        END objid,
                        CASE
                          WHEN e.objsubid = 0
                          THEN NULL
                          ELSE e.objsubid
                        END objsubid
                 FROM locks_1s_data d
                 JOIN locks_objects_extended e ON (d.object_id = e.object_id)
                 WHERE {{.Filter}})
      SELECT l.*,
             ll.locktype
      FROM l
      JOIN locks_locktypes ll ON (l.locktype_id = ll.locktype_id)
      WHERE l.unix_time = ?1
    )
    SELECT * FROM (
      WITH RECURSIVE l(process_id, locktype_id, granted, mode_id, object) AS (
        SELECT process_id,
               locktype_id,
               granted,
               mode_id,
               json_object('locktype', locktype, 'database', datid, 'relation', relation, 'page', page, 'tuple', tuple, 
                           'virtualxid', virtualxid, 'transactionid', transactionid, 'classid', classid,
                           'objid', objid, 'objsubid', objsubid) object
        FROM data),
      pairs AS (
        SELECT w.process_id waiter,
               l.process_id locker,
               l.object,
               l.mode_id
        FROM l w
        JOIN l ON l.object IS NOT DISTINCT FROM w.object
        AND l.locktype_id = w.locktype_id
        AND NOT l.process_id = w.process_id
        AND l.granted WHERE NOT w.granted
        AND NOT EXISTS (SELECT 1
                        FROM l i
                        WHERE i.process_id = l.process_id
                          AND i.locktype_id = l.locktype_id
                          AND i.object IS NOT DISTINCT FROM l.object
                          AND i.mode_id > l.mode_id)),
      leads AS (
        SELECT o.locker,
               1 level,
               count(*) q,
               json_array(locker) track,
               false AS cycle
        FROM pairs o
        GROUP BY o.locker
        UNION ALL
        SELECT i.locker,
               leads.level+1,
               (SELECT count(*) FROM pairs q WHERE q.locker=i.locker) q,
               json_insert(leads.track, '$[#]', i.locker) track,
               exists(SELECT 1 FROM json_each(json_extract(leads.track, '$')) WHERE json_each.value = i.locker) cycle
        FROM pairs i, leads
        WHERE i.waiter = leads.locker
        AND NOT cycle),
      subtree AS (
        SELECT locker process_id,
               locker parent,
               locker root,
               CASE
                 WHEN cycle
                 THEN track
               END dl,
               json_object('locktype', NULL, 'database', NULL, 'relation', NULL, 'page', NULL, 'tuple', NULL, 
                           'virtualxid', NULL, 'transactionid', NULL, 'classid', NULL, 'objid', NULL,
                           'objsubid', NULL) object,
               0 level,
               cast(locker AS text) path,
               json_group_array(locker) OVER () all_pids
        FROM leads o
        WHERE (cycle
               AND NOT EXISTS (SELECT exists(SELECT 1
                                             FROM json_each(json_extract(o.track, '$'))
                                             WHERE json_each.value = i.locker)
                               FROM leads i
                               WHERE (i.level > o.level OR i.q < o.q)))
        OR (NOT cycle
            AND NOT EXISTS (SELECT 1
                            FROM pairs
                            WHERE waiter = o.locker)
            AND NOT EXISTS (SELECT 1
                            FROM leads i
                            WHERE i.locker = o.locker
                              AND i.level < o.level))
        UNION ALL
        SELECT w.waiter process_id,
               subtree.process_id,
               subtree.root,
               CASE
                 WHEN exists(SELECT 1 FROM json_each(json_extract(subtree.dl, '$')) WHERE json_each.value = w.waiter)
                 THEN subtree.dl
               END,
               w.object,
               subtree.level+1,
               subtree.path || '.' || w.waiter,
               all_pids
        FROM subtree
        JOIN pairs w ON subtree.process_id = w.locker
                    AND NOT exists(SELECT 1
                                   FROM json_each(json_extract(all_pids, '$'))
                                   WHERE json_each.value = w.waiter)
      ),
      tree AS (
        SELECT process_id,
               parent,
               root,
               dl,
               object,
               level,
               path,
               all_pids,
               json_group_array(process_id) OVER ()
        FROM subtree
      ),
      d AS (
        SELECT process_id,
               exists(SELECT 1 FROM json_each(json_extract(dl, '$')) WHERE json_each.value = process_id) is_deadlock
        FROM tree
      )
      SELECT DISTINCT
             (strftime('%s', 'now') - r.xact_start) order_1, 
             path order_2,
             (a.unix_time - a.xact_start) xact_start,
             a.xact_start xact_age,
             (a.unix_time - a.state_change) state_change_start,
             a.state_change state_change_age,
             (a.unix_time - a.query_start) query_start,
             a.query_start query_age,
             dn.datname,
             un.usename,
             ch.client_addr,
             d.is_deadlock,
             CASE
               WHEN d.is_deadlock
               THEN json_extract(tree.dl, '$[1]')
               ELSE NULL
             END deadlock_pid,
             CASE
               WHEN d.is_deadlock
               THEN (json_object('locktype', a.locktype, 'database', a.datid, 'relation', a.relation, 'page', a.page,
                                 'tuple', a.tuple, 'virtualxid', a.virtualxid, 'transactionid', a.transactionid,
                                 'classid', a.classid, 'objid', a.objid, 'objsubid', a.objsubid))
               ELSE w.object
             END wait_on_object,
             tree.process_id,
             sn.state,
             wet.wait_event_type,
             wt.wait_event,
             parent,
             level,
             (SELECT count(*) FROM tree p WHERE p.path LIKE (tree.path||'%') AND NOT p.path = tree.path) blocked,
             substr(q.query_text, 1, cfg.query_text_property_max_len) query
      FROM cfg, tree
      LEFT JOIN pairs w ON w.waiter = tree.process_id
                       AND w.locker = tree.parent
      JOIN d USING (process_id)
      JOIN data a USING (process_id)
      JOIN data r ON r.process_id=tree.root
      JOIN sa_datnames dn ON a.datname_id = dn.datname_id
      JOIN sa_usenames un ON a.usename_id = un.usename_id
      JOIN sa_client_hosts ch ON a.client_host_id = ch.client_host_id
      JOIN sa_states sn ON a.state_id = sn.state_id
      JOIN sa_wait_event_types wet ON a.wait_event_type_id = wet.wait_event_type_id
      JOIN sa_wait_events wt ON a.wait_event_id = wt.wait_event_id
      JOIN sa_queries q ON a.ki_query_id = q.ki_query_id
      GROUP BY tree.process_id
      ORDER BY 1 DESC, 2);