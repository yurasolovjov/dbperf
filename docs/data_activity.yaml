      INSERT INTO sa_active_1s_sample_groups
      WITH
      alignment AS (
        SELECT alignment
        FROM alignment_config
        WHERE data_table = 'sa_active_1s_data'
      )
      SELECT unix_time/a.alignment*a.alignment unix_time,
             1 n_samples,
             SUM(n_elements) n_elements
      FROM sa_active_input_sessions_count, alignment a
      GROUP BY unix_time/a.alignment*a.alignment
      ON CONFLICT(unix_time) DO UPDATE
      SET n_samples = n_samples + excluded.n_samples,
          n_elements = n_elements + excluded.n_elements;
    
      WITH
      alignment AS (
        SELECT alignment
        FROM alignment_config
        WHERE data_table = 'sa_active_1s_data'
      ),
      pre_grouped AS (
        SELECT unix_time/a.alignment*a.alignment unix_time,
               process_id,
               client_host_id,
               usename_id,
               datname_id,
               state_id,
               ki_query_id,
               wait_event_type_id,
               wait_event_id,
               COUNT(*) n_elements
        FROM sa_input_sessions_enriched, alignment a
        WHERE state_id IN (SELECT state_id FROM sa_active_states)
        GROUP BY unix_time/a.alignment*a.alignment,
                 process_id,
                 client_host_id,
                 usename_id,
                 datname_id,
                 state_id,
                 ki_query_id,
                 wait_event_type_id,
                 wait_event_id
      )
      INSERT INTO sa_active_1s_data
      SELECT * FROM pre_grouped
      WHERE TRUE
      ON CONFLICT (
        unix_time,
        process_id,
        client_host_id,
        usename_id,
        datname_id,
        state_id,
        ki_query_id,
        wait_event_type_id,
        wait_event_id
      ) DO UPDATE SET n_elements = n_elements + excluded.n_elements;
    
