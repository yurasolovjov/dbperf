      WHERE completed_at IS NULL
    );
    
    DELETE FROM sa_datnames
    WHERE last_used < (
      SELECT MAX(time_shrink_request) FROM service_events
      WHERE completed_at IS NULL
    );
    
    DELETE FROM sa_states
    WHERE last_used < (
      SELECT MAX(time_shrink_request) FROM service_events
      WHERE completed_at IS NULL
    );
    
    DELETE FROM sa_queries
    WHERE last_used < (
      SELECT MAX(time_shrink_request) FROM service_events
      WHERE completed_at IS NULL
    );
    
    DELETE FROM sa_wait_event_types
    WHERE last_used < (
      SELECT MAX(time_shrink_request) FROM service_events
      WHERE completed_at IS NULL
    );
    
    DELETE FROM sa_wait_events
    WHERE last_used < (
      SELECT MAX(time_shrink_request) FROM service_events
      WHERE completed_at IS NULL
    );
    
    DELETE FROM sa_active_1s_sample_groups
    WHERE unix_time < (
      SELECT MAX(time_shrink_request) FROM service_events
      WHERE completed_at IS NULL
    );
    
    DELETE FROM locks_1s_sample_groups
    WHERE unix_time < (
      SELECT MAX(time_shrink_request) FROM service_events
