    UPDATE service_events SET
      completed_at = (SELECT MAX(n_merged_samples) FROM service_counters)
    WHERE completed_at IS NULL;
  update_alignment_config: >
    UPDATE alignment_config 
    SET alignment = ?1
    WHERE sample_groups_table = ?2
      AND (?3 == ?3);
data:
  size_bytes: >
    SELECT page_count,
    	   page_size
    FROM (SELECT (SELECT *
                  FROM pragma_page_count) page_count,
                 (SELECT *
                  FROM pragma_page_size) page_size
    ) pragmas;
  all_tables: >
    SELECT name FROM sqlite_schema
    WHERE type IN ('table','view')
    AND name NOT LIKE 'sqlite_%'
    ORDER BY 1;
  check_timestamp_existence: >
    SELECT EXISTS(SELECT 1 
                  FROM locks_1s_data d
                  JOIN locks_objects_extended e ON (d.object_id = e.object_id)
                  WHERE unix_time = ?1
                  AND ({{.Filter}})
    );
  select_available_alignments: >
    WITH dummy AS (
          SELECT ?2
    )
    SELECT alignment
    FROM alignment_config
    WHERE sample_groups_table LIKE ?1;
  select_time_alignment_config: >
    WITH available_alignments AS (
      SELECT sample_groups_table,
             data_table,
             query_range_limit_seconds,
             avail_alignment,
             agreed_alignment,
             (?1 / agreed_alignment) -- floor
             * agreed_alignment start_time,
             (?2 / agreed_alignment + (?2 % agreed_alignment > 0)) -- ceil
             * agreed_alignment end_time
      FROM (
        SELECT cfg.sample_groups_table,
               cfg.data_table,
               cfg.query_range_limit_seconds,
               cfg.alignment avail_alignment,
               CAST(MAX(ROUND(req.max_req_alignment / cfg.alignment), 1.0) AS INTEGER) * cfg.alignment agreed_alignment
        FROM (
          SELECT MAX(requested.alignment) max_req_alignment
          FROM (
            SELECT CAST(j.value AS REAL) alignment
            FROM json_each(?4) j
            UNION ALL
            SELECT ?5 alignment
          ) requested
        ) req
        CROSS JOIN alignment_config cfg
      ) t
    ),
    dummy AS (
      SELECT ?7
    )
    SELECT start_time,
           adjusted_end_time end_time,
           agreed_alignment alignment,
           sample_groups_table,
           data_table
    FROM (
      SELECT sample_groups_table,
             data_table,
             query_range_limit_seconds,
             avail_alignment,
             agreed_alignment,
             start_time,
             adjusted_end_time,
             CASE
               WHEN range < 0 THEN 0
               ELSE range
             END range,
             n_points,
             MAX(n_points) OVER() max_n_points
      FROM (
        SELECT sample_groups_table,
               data_table,
               query_range_limit_seconds,
               avail_alignment,
               agreed_alignment,
               start_time,
               adjusted_end_time,
               (adjusted_end_time - start_time) range,
               (adjusted_end_time - start_time) / agreed_alignment + 1 n_points
        FROM (
          SELECT sample_groups_table,
                 data_table,
                 query_range_limit_seconds,
                 avail_alignment,
                 agreed_alignment,
                 start_time,
                 CASE
                   WHEN mmst.unix_time IS NOT NULL
                   THEN MIN(end_time, mmst.unix_time / agreed_alignment * agreed_alignment)
                   ELSE end_time
                 END adjusted_end_time
          FROM available_alignments
          CROSS JOIN sa_max_merged_sample_time mmst
          WHERE sample_groups_table LIKE ?6
        ) with_adjusted_end_time
      ) with_n_points
      WHERE (range <= query_range_limit_seconds OR query_range_limit_seconds IS NULL)
        AND n_points <= ?3
    ) with_max_n_points
    WHERE n_points = max_n_points
    ORDER BY avail_alignment DESC
    LIMIT 1;
  select_slice_top_top: >
    WITH bounded_totals AS (
      SELECT SUM(t.n_samples) n_samples,
             SUM(t.n_elements) n_elements
      FROM {{.SampleGroupsTable}} t
      WHERE t.unix_time >= ?2
      AND t.unix_time < (?3 + ?1)
    ),
    filtered_data AS (
      SELECT t.{{.Slice1Column}} slice1,
             t.{{.Slice2Column}} slice2,
             t.n_elements
      FROM {{.DataTable}} t
      WHERE t.unix_time >= ?2
        AND t.unix_time < (?3 + ?1)
        AND ({{.DataTableWhereClauseExtra}})
    ),
    top_slices_1 AS (
      SELECT slice1,
             SUM(n_elements) slice1_sessions
      FROM filtered_data
      GROUP BY 1
      ORDER BY 2 DESC, 1
      LIMIT ?4
    ),
    top_slices_2 AS (
      SELECT slice2,
             SUM(n_elements) slice2_weight
      FROM filtered_data
      GROUP BY 1
      ORDER BY 2 DESC, 1
      LIMIT ?5
    ),
    slice_matrix AS (
      SELECT ts1.slice1,
             ts1.slice1_sessions slice1_weight,
             ts2ext.slice2,
             ts2ext.slice2_weight,
             CASE
               WHEN ts2ext.slice2 IS NULL /* SLICE1 SUMMARY */
               THEN ts1.slice1_sessions
             ELSE NULL
             END slice1_summary
      FROM top_slices_1 ts1
      JOIN (
        SELECT ts2.slice2,
               ts2.slice2_weight
        FROM top_slices_2 ts2
        UNION ALL
        SELECT 0 /* REMAINDER SLICE */ slice2, -1 slice2_weight
        UNION ALL
        SELECT NULL /* SLICE1 SUMMARY */ slice2, NULL slice2_weight
      ) ts2ext
    ),
    slice_aggregates AS (
      SELECT d.slice1,
             COALESCE(ts2.slice2, 0 /* REMAINDER SLICE */) slice2,
             SUM(n_elements) n_elements
      FROM (
        SELECT slice1,
               slice2,
               SUM(n_elements) n_elements
        FROM filtered_data
        GROUP BY 1, 2
      ) d
      LEFT JOIN top_slices_2 ts2 ON d.slice2 = ts2.slice2
      GROUP BY d.slice1, ts2.slice2
    ),
    dummy AS (
      SELECT ?6
    )
    SELECT res.slice1,
           res.slice1_weight,
           res.slice2,
           res.slice2_weight,
           ROUND(CAST(res.n_elements AS REAL) / bt.n_samples, 3) aas_value,
           ROUND(CAST(res.n_elements AS REAL) / bt.n_elements * 100, 3) ptta_value
    FROM (
      SELECT sm.slice1,
             sm.slice1_weight,
             sm.slice2,
             sm.slice2_weight,
             COALESCE(sm.slice1_summary, sa.n_elements, 0) n_elements
      FROM slice_matrix sm
      LEFT JOIN slice_aggregates sa ON (sm.slice1 = sa.slice1 AND sm.slice2 = sa.slice2)
    ) res
    JOIN bounded_totals bt
    ORDER BY {{.Slice1OrderBy}}, {{.Slice2OrderBy}};
  select_slice_time_top: >
    WITH bounded_totals AS (
      SELECT t.unix_time/?1*?1 unix_time,
             SUM(t.n_samples) n_samples
      FROM {{.SampleGroupsTable}} t
      WHERE t.unix_time >= ?2
        AND t.unix_time < (?3 + ?1)
      GROUP BY 1
    ),
    filtered_data AS (
      SELECT t.unix_time,
             t.{{.Slice2Column}} slice2,
             t.n_elements
      FROM {{.DataTable}} t
      WHERE t.unix_time >= ?2
        AND t.unix_time < (?3 + ?1)
        AND ({{.DataTableWhereClauseExtra}})
    ),
    top_slices AS (
      SELECT slice2,  
             SUM(n_elements) slice2_weight
      FROM filtered_data
      GROUP BY 1
      ORDER BY 2 DESC, 1
      LIMIT ?4
    ),
    aligned_data AS (
      SELECT unix_time/?1*?1 unix_time,
             slice2,
             SUM(n_elements) n_elements
      FROM filtered_data
      GROUP BY 1, 2
    ),
    non_empty_aggregates AS (
      SELECT d.unix_time unix_time,
             COALESCE(ts.slice2, 0 /* REMAINDER SLICE */) slice2,
             SUM(d.n_elements) n_elements
      FROM aligned_data d
      LEFT JOIN top_slices ts ON d.slice2 = ts.slice2
      GROUP BY d.unix_time, ts.slice2
    ),
    dummy AS (
      SELECT ?5
    )
    SELECT unix_time,
           slice2,
           n_elements,
           n_tp_samples,
           n_tp_sessions,
           n_slice_sessions,
           n_total_sessions,
           n_total_samples,
           CASE
             WHEN unix_time IS NOT NULL AND slice2 IS NOT NULL
             THEN ROUND(CAST(n_elements AS REAL) / n_tp_samples, 3)
             WHEN unix_time IS NOT NULL AND slice2 IS NULL
             THEN ROUND(CAST(n_tp_sessions AS REAL) / n_tp_samples, 3)
             WHEN unix_time IS NULL AND slice2 IS NOT NULL
             THEN CASE
                    WHEN n_total_samples <> 0
                    THEN ROUND(CAST(n_slice_sessions AS REAL) / n_total_samples, 3)
                    ELSE CAST(0 AS REAL)
                  END
             ELSE CASE
                    WHEN n_total_samples <> 0
                    THEN ROUND(CAST(n_total_sessions AS REAL) / n_total_samples, 3)
                    ELSE CAST(0 AS REAL)
                  END
           END avg_sessions
    FROM (
      SELECT tps.unix_time,
             sls.slice2,
             sls.slice2_weight,
             COALESCE(ags.n_elements, 0) n_elements,
             tps.n_tp_samples,
             SUM(COALESCE(ags.n_elements, 0)) OVER (
               PARTITION BY tps.unix_time ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_tp_sessions,
             SUM(COALESCE(ags.n_elements, 0)) OVER (
               PARTITION BY sls.slice2 ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_slice_sessions,
             SUM(COALESCE(ags.n_elements, 0)) OVER (
               ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_total_sessions,
             COALESCE(MAX(tps.n_total_samples) OVER (
               ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING), 0) n_total_samples
        FROM (
          SELECT unix_time,
                 n_samples n_tp_samples,
                 SUM(n_samples) OVER (
                   ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_total_samples
          FROM bounded_totals
          UNION ALL
          -- 'slice summary' and 'total summary' preform
          SELECT NULL unix_time,
                 NULL n_tp_samples,
                 NULL n_total_samples
        ) tps
        JOIN (
          SELECT slice2,
                 slice2_weight
          FROM top_slices
          UNION ALL
          SELECT 0 /* REMAINDER SLICE */ slice2, 
          -1 slice2_weight
          UNION ALL
          -- 'time point summary' and 'total summary' preform
          SELECT NULL slice2,
                 NULL slice2_weight
      ) sls
      LEFT JOIN non_empty_aggregates ags
      ON (tps.unix_time = ags.unix_time AND sls.slice2 = ags.slice2)
    ) t
    ORDER BY t.unix_time, {{.Slice2OrderBy}};
  select_slice_time_totals: >
    WITH bounded_totals AS (
      SELECT t.unix_time/?1*?1 unix_time,
             SUM(t.n_samples) n_samples,
             SUM(t.n_elements) n_elements
      FROM {{.SampleGroupsTable}} t
      WHERE t.unix_time >= ?2
        AND t.unix_time < (?3 + ?1)
      GROUP BY 1
    ),
    dummy AS (
      SELECT ?4
    )
    SELECT unix_time,
           ROUND(CAST(n_elements AS REAL) / n_samples, 3) aas_value,
           ROUND(CAST(n_total_sessions AS REAL) / n_total_samples, 3) avg_aas_value
    FROM (
        SELECT unix_time,
               n_samples,
               n_elements,
               SUM(n_samples) OVER (ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_total_samples,
               SUM(n_elements) OVER (ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) n_total_sessions
        FROM bounded_totals bt
    );
  ki_pi_stats: >
