# dbperf-ui: static files plus a reverse proxy to the dbperf JSON API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # JSON gateway of dbperf (HTTP listener :9091). The hostname is resolved
    # at request time so nginx starts even when dbperf is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dbperf_api http://dbperf:9091;
    set $registry_api http://registry:9101;
    # dbperf-registry: targets CRUD, bulk import, assignments
    location /api/v1/registry/ {
        proxy_pass $registry_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 130s;
        client_max_body_size 16m;
    }
    location /api/ {
        proxy_pass $dbperf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 70s;
    }
    location = /healthz {
        proxy_pass $dbperf_api;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
